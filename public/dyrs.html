<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影视仓 - 影视播放站</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
/* 影视仓专用样式，统一 dw- 前缀，不动 style.css 里的既有类 */
.dw-filter {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex-wrap: wrap;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
}
.dw-filter:last-child { border-bottom: none; margin-bottom: 12px; }
.dw-filter-label {
  color: var(--text-dim);
  font-size: 13px;
  min-width: 3rem;
  padding: 4px 0;
  flex-shrink: 0;
}
.dw-filter a {
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid transparent;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13px;
}
.dw-filter a:hover { background: var(--bg-3); color: var(--text); }
.dw-filter a.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 预设频道（纪录片 / 蓝光 / 美剧）不是上游的独立频道，用虚线描边区分，避免误导 */
.lines button.preset {
  border: 1px dashed var(--accent);
  color: var(--accent);
  background: transparent;
}
.lines button.preset:hover { background: var(--bg-3); }
.lines button.preset.active {
  border-style: solid;
  background: var(--accent);
  color: #fff;
}
</style>
</head>
<body>
<main class="wrap">
  <div class="section-title">
    <h2 id="headTitle">影视仓</h2>
    <span id="hint" class="badge"></span>
  </div>

  <div class="lines" id="catBox" style="margin-bottom:12px"></div>
  <div id="filterBox"></div>

  <div id="content">
    <div class="state"><span class="spinner"></span> 加载中…</div>
  </div>
  <div id="pager" class="pager"></div>
</main>

<script src="app.js"></script>
<script>
/* 影视仓（dyrs）浏览页：首页推荐 / 分类列表 / 搜索。
 * 点卡片进 dyrs-detail.html，点选集才跳老播放页 play.html（复用同一套播放器）。 */

window.__searchBase = 'dyrs.html?wd=';

const params = new URLSearchParams(location.search);
const wd = params.get('wd') || '';
let channel = params.get('ch') || '';
let page = Math.max(0, Number(params.get('page')) || 0);

mountTopbar('dyrs.html');

/**
 * 频道条：5 个上游真实频道 + 3 个「预设筛选」入口。
 *
 * 预设不是上游真有这个频道，而是把它的稳定筛选组合提上来（后端 SITE_PRESETS 同源）：
 *   纪录片 = 电影 + class=纪录片 · 蓝光 = 电影 + origin=王者TV蓝光 · 美剧 = 电视剧 + area=美国
 * 首页接口会带回权威清单（r.channels），回来后就地覆盖，避免两边各维护一份。
 */
const CHANNELS = [
  ['dianying', '电影', false],
  ['dianshiju', '电视剧', false],
  ['zongyi', '综艺', false],
  ['dongman', '动漫', false],
  ['duanju', '短剧', false],
  ['doc', '纪录片', true],
  ['bluray', '蓝光', true],
  ['us', '美剧', true],
];

/** 会被透传给上游列表接口的筛选参数（与后端 buildSiteListPath 对齐） */
const FILTER_KEYS = ['class', 'area', 'year', 'sort_field', 'line', 'ban', 'exclude'];

function channelName(key) {
  const hit = CHANNELS.find((c) => c[0] === key);
  return hit ? hit[1] : key;
}

const content = document.getElementById('content');
const pager = document.getElementById('pager');
const catBox = document.getElementById('catBox');
const filterBox = document.getElementById('filterBox');
const headTitle = document.getElementById('headTitle');
const hint = document.getElementById('hint');

/** 渲染令牌：防止慢请求回来覆盖新内容 */
let renderToken = 0;

/* ---------------- 渲染 ---------------- */

/** 封面统一走站内图片代理（上游要 Referer，还带反爬校验，浏览器直连必 403） */
function coverUrl(item) {
  if (item.id) return `${API}/dyrs/site/img?id=${encodeURIComponent(item.id)}`;
  if (item.pic) return `${API}/dyrs/site/img?u=${encodeURIComponent(item.pic)}`;
  return '';
}

function detailHrefOf(item) {
  const p = new URLSearchParams({ id: item.id, kind: item.kind || 'tv', ep: item.ep || '1' });
  if (item.name) p.set('name', item.name);
  return `dyrs-detail.html?${p.toString()}`;
}

function renderCard(item) {
  const pic = coverUrl(item);
  const poster = pic
    ? `<img class="poster" src="${esc(pic)}" alt="${esc(item.name)}" loading="lazy">`
    : `<div class="poster-ph">${esc(item.name)}</div>`;

  const bits = [];
  if (item.year) bits.push(esc(item.year));
  if (item.cat) bits.push(esc(item.cat));
  if (item.remark) bits.push(esc(item.remark));

  const score = item.score && Number(item.score) > 0
    ? `<span class="badge score">${esc(item.score)}</span>`
    : '';

  return `
    <div class="card" onclick="location.href='${detailHrefOf(item)}'">
      ${poster}
      <div class="meta">
        <div class="title" title="${esc(item.name)}">${esc(item.name)}</div>
        <div class="sub">${score}${bits.join(' · ')}</div>
      </div>
    </div>`;
}

function renderCatRow() {
  catBox.innerHTML = CHANNELS.map(([c, n, preset]) => {
    const active = c === channel ? ' active' : '';
    const cls = preset ? ` preset${active}` : active;
    // 预设项加个描边，视觉上和真实频道区分开
    return `<button class="${cls.trim()}" title="${preset ? '筛选组合入口' : ''}" onclick="goChannel('${c}')">${n}</button>`;
  }).join('');
}

/** 上游筛选行的 href（/dianying.html?class=..）→ 本站影视仓地址 */
function filterHref(href) {
  try {
    const u = new URL(href, location.origin);
    const ch = (u.pathname.match(/^\/([a-z]+)\.html$/) || [])[1] || channel;
    const q = new URLSearchParams(u.search);
    q.delete('page');
    // 上游的 `origin`（线路筛选）换成我们的 `line`：我们 API 里 origin 已经是「线路」的语义
    const line = q.get('origin');
    if (line) {
      q.delete('origin');
      q.set('line', line);
    }
    // 上游两条排除参数合并成我们的 exclude=his|unlike
    if (q.get('exclude_his')) {
      q.delete('exclude_his');
      q.set('exclude', 'his');
    }
    if (q.get('exclude_unlike')) {
      q.delete('exclude_unlike');
      q.set('exclude', 'unlike');
    }
    q.set('ch', ch);
    return `dyrs.html?${q.toString()}`;
  } catch {
    return `dyrs.html?ch=${encodeURIComponent(channel)}`;
  }
}

/** 上游筛选参数 → 我们的参数名（`origin` 是上游的叫法，`line` 是我们的） */
const FILTER_MAP = [
  ['class', 'class'],
  ['area', 'area'],
  ['year', 'year'],
  ['sort_field', 'sort_field'],
  ['origin', 'line'],
  ['ban', 'ban'],
];

/** 当前选中的筛选项（只对「带参数」的选项高亮，避免整行都亮） */
function isActiveFilter(href) {
  try {
    const u = new URL(href, location.origin);
    let any = false;
    for (const [upKey, ourKey] of FILTER_MAP) {
      const want = u.searchParams.get(upKey) || '';
      const have = params.get(ourKey) || '';
      if (want !== have) return false;
      if (want) any = true;
    }
    // 排除类：上游是两条参数，我们统一成一个 exclude
    const exUp = u.searchParams.get('exclude_his')
      ? 'his'
      : u.searchParams.get('exclude_unlike')
        ? 'unlike'
        : '';
    if (exUp !== (params.get('exclude') || '')) return false;
    if (exUp) any = true;
    return any;
  } catch {
    return false;
  }
}

function renderFilters(filters) {
  if (!filters || filters.length === 0) { filterBox.innerHTML = ''; return; }
  /*
   * 「排除」行（已观看 / 不想看）是上游给登录用户准备的：
   * 我们全程匿名抓页面，没有观看历史可排除，实测带上 exclude_his 结果完全不变。
   * 与其摆两个点了没反应的按钮，不如不渲染。
   */
  const rows = filters.filter((row) => row.label !== '排除');
  filterBox.innerHTML = rows.map((row) => {
    const opts = (row.options || []).map((o) => {
      const href = filterHref(o.href);
      const active = isActiveFilter(o.href) ? ' class="active"' : '';
      return `<a href="${esc(href)}"${active}>${esc(o.text)}</a>`;
    }).join('');
    return `<div class="dw-filter"><span class="dw-filter-label">${esc(row.label)}</span>${opts}</div>`;
  }).join('');
}

function renderPager(p, mx) {
  if (mx <= 0) { pager.innerHTML = ''; return; }
  pager.innerHTML = `
    <button ${p <= 0 ? 'disabled' : ''} onclick="goPage(${p - 1})">上一页</button>
    <span class="info">第 ${p + 1} / ${mx + 1} 页</span>
    <button ${p >= mx ? 'disabled' : ''} onclick="goPage(${p + 1})">下一页</button>
    <button onclick="goPage(0)">首页</button>`;
}

/* ---------------- 数据 ---------------- */

async function load() {
  filterBox.innerHTML = '';
  pager.innerHTML = '';
  renderCatRow();
  const token = ++renderToken;
  content.innerHTML = '<div class="state"><span class="spinner"></span> 加载中…</div>';

  try {
    /* 搜索 */
    if (wd) {
      headTitle.textContent = `影视仓 · 搜索“${wd}”`;
      hint.textContent = '';
      const r = await api(`/dyrs/site/search?wd=${encodeURIComponent(wd)}`);
      if (token !== renderToken) return;
      const cards = r.cards || [];
      hint.textContent = `命中 ${cards.length} 条`;
      content.innerHTML = cards.length
        ? `<div class="grid">${cards.map(renderCard).join('')}</div>`
        : `<div class="state"><div class="big">🔍</div>影视仓里没有找到「${esc(wd)}」</div>`;
      return;
    }

    /* 分类列表 */
    if (channel) {
      const name = channelName(channel);
      headTitle.textContent = `影视仓 · ${name}`;
      const q = new URLSearchParams();
      for (const k of FILTER_KEYS) {
        const v = params.get(k);
        if (v) q.set(k, v);
      }
      q.set('ch', channel);
      q.set('page', String(page));

      const r = await api(`/dyrs/site/list?${q.toString()}`);
      if (token !== renderToken) return;

      const cards = r.cards || [];
      hint.textContent = r.maxPage > 0 ? `第 ${r.page + 1} / ${r.maxPage + 1} 页` : '';
      renderFilters(r.filters);
      if (cards.length) {
        content.innerHTML = `<div class="grid">${cards.map(renderCard).join('')}</div>`;
      } else if (r.empty) {
        // 预设频道（纪录片/蓝光）内容本来就少，空结果不是错误
        content.innerHTML = `<div class="state"><div class="big">🗂</div>「${esc(name)}」这个筛选下暂时没有内容
          <div style="margin-top:12px"><button onclick="goChannel('dianying')">回电影频道</button></div></div>`;
      } else {
        content.innerHTML = '<div class="state">这一页没有内容</div>';
      }
      renderPager(r.page, r.maxPage);
      return;
    }

    /* 首页推荐 */
    headTitle.textContent = '影视仓';
    hint.textContent = '';
    const r = await api('/dyrs/site/home');
    if (token !== renderToken) return;

    // 后端返回权威频道清单时同步过来，避免前后端各维护一份频道表
    if (Array.isArray(r.channels) && r.channels.length) {
      CHANNELS.splice(0, CHANNELS.length, ...r.channels.map((c) => [c.key, c.name, !!c.preset]));
      renderCatRow();
    }

    let html = '';
    const banner = (r.banner || []).slice(0, 10);
    if (banner.length) {
      html += `<div class="section-title"><h2>正在热播</h2></div>`
        + `<div class="grid">${banner.map((b) => renderCard({
            id: b.id, kind: b.kind, ep: b.ep, name: b.name, pic: b.pic, remark: b.remark,
          })).join('')}</div>`;
    }

    for (const s of (r.strips || [])) {
      if (!s.cards || s.cards.length === 0) continue;
      html += `<div class="section-title"><h2>${esc(s.name)}</h2>`
        + `<button style="margin-left:auto" onclick="goChannel('${s.channel}')">更多 ›</button></div>`
        + `<div class="grid">${s.cards.map(renderCard).join('')}</div>`;
    }

    content.innerHTML = html || '<div class="state">影视仓暂时没有返回内容</div>';
  } catch (e) {
    if (token !== renderToken) return;
    content.innerHTML = `<div class="state"><div class="big">⚠️</div>${esc(e.message)}
      <div style="margin-top:12px"><button class="primary" onclick="load()">重试</button></div></div>`;
  }
}

function goChannel(c) {
  location.href = `dyrs.html?ch=${encodeURIComponent(c)}`;
}

function goPage(n) {
  if (n < 0) return;
  const q = new URLSearchParams();
  for (const k of FILTER_KEYS) {
    const v = params.get(k);
    if (v) q.set(k, v);
  }
  q.set('ch', channel);
  q.set('page', String(n));
  location.href = `dyrs.html?${q.toString()}`;
}

load();
</script>
</body>
</html>
