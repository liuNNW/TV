<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>详情 - 影视播放站</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div id="content">
    <div class="state"><span class="spinner"></span> 加载中…</div>
  </div>
</main>

<script src="app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const videoId = params.get('id') || '';
const source = params.get('source') || '';
const fallbackName = params.get('name') || '';

let detail = null;
let lineIndex = 0;
let progressMap = {};   // "line-ep" -> {position, duration}

mountTopbar('detail.html');

async function load() {
  const box = document.getElementById('content');
  if (!videoId) {
    box.innerHTML = '<div class="state">缺少片目参数</div>';
    return;
  }

  try {
    // 带 name 校验，避免跨源 vod_id 撞车
    const r = await api(`/detail?id=${encodeURIComponent(videoId)}&source=${encodeURIComponent(source)}&name=${encodeURIComponent(fallbackName)}`);
    detail = r.detail;

    // 详情没线路时按名字再找一次
    if (detail && (!detail.lines || detail.lines.length === 0) && fallbackName) {
      try {
        const r2 = await api(`/detail-by-name?name=${encodeURIComponent(fallbackName)}&source=${encodeURIComponent(r.source)}`);
        if (r2.detail && r2.detail.lines && r2.detail.lines.length) detail = r2.detail;
      } catch { /* 保持原样 */ }
    }

    render();
    loadProgress();
  } catch (e) {
    box.innerHTML = `<div class="state"><div class="big">⚠️</div>${esc(e.message)}<div style="margin-top:12px"><button class="primary" onclick="load()">重试</button></div></div>`;
  }
}

function render() {
  document.title = `${detail.name} - 影视播放站`;
  const box = document.getElementById('content');

  if (!detail.lines || detail.lines.length === 0) {
    box.innerHTML = `<div class="err">这个片源没有可用的播放地址。${fallbackName ? '可以试试回首页搜索其他片源。' : ''}</div>`;
    return;
  }

  const poster = posterHTML(detail.pic, detail.name);

  // 年份/地区/语言/类型/状态 收成一行 chips —— 原来各占一行，白白吃掉 130px 高度
  const chips = [detail.year, detail.area, detail.lang, detail.typeName, detail.remarks]
    .filter(Boolean)
    .map((t) => `<span class="chip">${esc(t)}</span>`)
    .join('');
  const scoreChip =
    detail.score && Number(detail.score) > 0
      ? `<span class="chip score">★ ${esc(detail.score)}</span>`
      : '';

  box.innerHTML = `
    <div class="detail-head">
      <div class="poster-lg">${poster}</div>
      <div class="detail-info">
        <h1>${esc(detail.name)}</h1>
        ${detail.sub ? `<div class="row">别名：${esc(detail.sub)}</div>` : ''}
        ${chips || scoreChip ? `<div class="meta-chips">${chips}${scoreChip}</div>` : ''}
        ${detail.director ? `<div class="row"><b>导演</b> ${esc(detail.director)}</div>` : ''}
        ${
          detail.actor
            ? `<div class="row"><b>主演</b> <span class="clamp-2" id="actorText">${esc(detail.actor)}</span></div>
               <button class="link-btn" onclick="toggleClamp('actorText', this, '展开主演', '收起主演')">展开主演</button>`
            : ''
        }
        <div class="row"><b>片源</b> ${esc(detail.sourceName)}</div>
        ${
          detail.content
            ? `<div class="plot" id="plot">${esc(detail.content)}</div>
               <button class="link-btn" onclick="toggleClamp('plot', this, '展开简介', '收起简介')">展开简介</button>`
            : ''
        }
        <div class="actions">
          <button class="primary" onclick="play(${firstPlayableIndex()}, 0)">▶ 播放第一集</button>
          <button id="favBtn" onclick="toggleFav()">☆ 收藏</button>
        </div>
        ${detail.lines.some((l) => !l.playable) ? `<div class="hint">标 ⚠ 的线路连服务端也解析不出播放地址，建议换一条。</div>` : ''}
      </div>
    </div>

    <div class="section-title"><h2>选线路 / 选集</h2></div>
    <div class="lines line-chips" id="lineBox"></div>
    <div class="episodes" id="epBox"></div>

    <div class="detail-playbar" id="playbar">
      <div class="pb-info">
        <b>${esc(detail.name)}</b>
        <span id="pbLine"></span>
      </div>
      <button class="primary" onclick="play(${lineIndex}, 0)">▶ 播放</button>
    </div>
  `;

  renderLines();
  renderEpisodes();
  refreshFav();
  syncPlaybarLine();
  initPlaybar();
}

/** 悬浮播放条上显示当前线路名 */
function syncPlaybarLine() {
  const el = document.getElementById('pbLine');
  const line = detail && detail.lines ? detail.lines[lineIndex] : null;
  if (!el) return;
  el.textContent = line ? `${line.name}${line.sourceName ? ' · ' + line.sourceName : ''}` : '';
}

/**
 * 手机端悬浮播放条：滚过头部才出现。
 * 桌面端由媒体查询挡住（.detail-playbar 默认 display:none）。
 */
function initPlaybar() {
  const bar = document.getElementById('playbar');
  const head = document.querySelector('.detail-head');
  if (!bar || !head || !('IntersectionObserver' in window)) return;
  new IntersectionObserver(
    ([entry]) => {
      const show = !entry.isIntersecting;
      bar.classList.toggle('show', show);
      document.body.classList.toggle('has-playbar', show);
    },
    { rootMargin: '-72px 0px 0px 0px' },
  ).observe(head);
}

/** 默认落在第一条真正能播的线路上 */
function firstPlayableIndex() {
  const i = detail.lines.findIndex((l) => l.playable);
  return i >= 0 ? i : 0;
}

function renderLines() {
  const box = document.getElementById('lineBox');
  // 线路是**跨源聚合**来的：同一部片可能来自 lziapi / ffzy / dytt 等几个源，
  // 名字后面带上源名，用户才知道自己在切什么，排查时也能一眼看出是谁抽了。
  box.innerHTML = detail.lines
    .map((l, i) => {
      // ⚙ = 分享页线路（服务端能解析出真 m3u8，只是这张卡还没验活）
      // ⚠ = 服务端也解析不出来，真的放不了
      const flag = l.playable ? '' : l.needsResolve ? ' ⚙' : ' ⚠';
      const warn = l.playable
        ? ''
        : l.needsResolve
          ? '（播放时会自动解析出真实地址）'
          : '（需浏览器打开，可能无法直接播放）';
      const from = l.sourceName && l.sourceName !== detail.sourceName ? l.sourceName : l.sourceName || '';
      // 两行结构：主名（超长省略）/ 副行（源 · 集数）。一行塞不下时靠 .ln-name 截断，
      // 不再让长名字把整行按钮撑成参差不齐的一堆宽度
      return `<button class="${i === lineIndex ? 'active' : ''}" onclick="pickLine(${i})" title="${esc(l.name)} · ${esc(from)}${esc(warn)}">
        <span class="ln-name">${esc(l.name)}${flag}</span>
        <span class="ln-sub">${esc(from)} · ${l.episodes.length} 集</span>
      </button>`;
    })
    .join('');
}

function pickLine(i) {
  lineIndex = i;
  renderLines();
  renderEpisodes();
  syncPlaybarLine();
}

function renderEpisodes() {
  const box = document.getElementById('epBox');
  const line = detail.lines[lineIndex];

  box.innerHTML = line.episodes.map((e, i) => {
    const p = progressMap[`${lineIndex}-${i}`];
    let bar = '';
    if (p && p.duration > 0 && p.position > 0) {
      const pct = Math.min(100, (p.position / p.duration) * 100);
      bar = `<span class="prog"><i style="width:${pct.toFixed(1)}%"></i></span>`;
    }
    return `<div class="ep" onclick="play(${lineIndex}, ${i})" title="${esc(e.name)}">${esc(e.name)}${bar}</div>`;
  }).join('');
}

function play(li, ei) {
  const item = { id: detail.id, source: detail.source, name: detail.name, pic: detail.pic, year: detail.year };
  // 把线路对象一起传下去：线路是跨源聚合的，播放页要按「名字+源」定位而不是下标
  location.href = playHref(item, li, ei, detail.lines[li]);
}

/* 已看进度：从历史里取，画在选集上 */
async function loadProgress() {
  try {
    const r = await api('/history');
    for (const h of r.items) {
      if (h.id === detail.id && h.source === detail.source) {
        progressMap[`${h.lineIndex}-${h.episodeIndex}`] = { position: h.position, duration: h.duration };
      }
    }
    renderEpisodes();
  } catch { /* 忽略 */ }
}

async function refreshFav() {
  const btn = document.getElementById('favBtn');
  try {
    const r = await api(`/favorite-status?id=${encodeURIComponent(detail.id)}&source=${encodeURIComponent(detail.source)}`);
    btn.textContent = r.favorite ? '★ 已收藏' : '☆ 收藏';
    btn.classList.toggle('active', r.favorite);
  } catch { /* 忽略 */ }
}

async function toggleFav() {
  try {
    const r = await api(`/favorite-status?id=${encodeURIComponent(detail.id)}&source=${encodeURIComponent(detail.source)}`);
    if (r.favorite) {
      await api(`/favorites?id=${encodeURIComponent(detail.id)}&source=${encodeURIComponent(detail.source)}`, { method: 'DELETE' });
      toast('已取消收藏');
    } else {
      await api('/favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: detail.id, name: detail.name, source: detail.source, pic: detail.pic, year: detail.year }),
      });
      toast('已加入收藏');
    }
    refreshFav();
  } catch (e) {
    toast(e.message);
  }
}

load();
</script>
</body>
</html>
